name: Lint, Check and Build

on:
  push:
  workflow_call:
permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  basic-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Install dependencies
        run: deno install --frozen

      - name: Run format check
        run: deno task format:check

      - name: Run lint
        run: deno task lint:github

      - name: Run typecheck
        run: deno task typecheck

      - name: Run tests
        run: deno task test

      - name: Check migration drift
        run: deno task db:check

      - name: Run app build
        env:
          NODE_ENV: production
        run: deno task build

      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Check Nix dependency hashes
        run: scripts/update-deno-deps-hashes.sh --check

      - name: Run Nix flake check
        run: nix flake check
