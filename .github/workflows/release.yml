name: Release

run-name: Release ${{ inputs.version || inputs.bump }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump major, minor, or patch
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: Exact version override (optional, for example 1.6.0)
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  preflight:
    name: Resolve release
    if: github.ref == 'refs/heads/dev'
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ steps.release.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - id: release
        name: Resolve version, commit, and tag
        shell: bash
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("package.json")).version)')"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package.json version: $current" >&2
            exit 1
          fi

          release_published() {
            gh release view "$1" --json isDraft \
              --jq 'if .isDraft then "draft" else "published" end' \
              2>/dev/null | grep -qx "published"
          }

          if [[ -n "$INPUT_VERSION" ]]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version override must be plain semver: $INPUT_VERSION" >&2
              exit 1
            fi
            version="$INPUT_VERSION"
          elif ! git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            echo "Recovering untagged version $current."
            version="$current"
          elif ! release_published "v$current"; then
            echo "Recovering unpublished release v$current."
            version="$current"
          else
            IFS=. read -r major minor patch <<< "$current"
            case "${INPUT_BUMP:-patch}" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
              *)
                echo "Unsupported version bump: $INPUT_BUMP" >&2
                exit 1
                ;;
            esac
          fi

          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if release_published "$tag"; then
              echo "Release $tag is already published." >&2
              exit 1
            fi
            ref="$(git rev-list -n 1 "$tag")"
          else
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            if [[ "$version" != "$current" ]]; then
              # Keep the Deno template expression literal until Deno evaluates it.
              # shellcheck disable=SC2016
              RELEASE_VERSION="$version" deno eval '
                  const packageJson = JSON.parse(Deno.readTextFileSync("package.json"))
                  packageJson.version = Deno.env.get("RELEASE_VERSION")
                  Deno.writeTextFileSync(
                    "package.json",
                    `${JSON.stringify(packageJson, null, 2)}\n`,
                  )
                '
              git add package.json
              git commit -m "chore: release $tag"
            fi

            git tag "$tag"
            git push --atomic origin HEAD:dev "refs/tags/$tag"
            ref="$(git rev-parse HEAD)"
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Publish container image
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Build and load container image
        run: |
          nix build .#dockerImage --out-link docker-image
          docker load --input docker-image

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag and push container image
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "inviterr:$RELEASE_VERSION" "$image:$RELEASE_VERSION"
          docker tag "inviterr:$RELEASE_VERSION" "$image:latest"
          docker push "$image:$RELEASE_VERSION"
          docker push "$image:latest"

  publish:
    name: Publish GitHub release
    needs:
      - preflight
      - image
    runs-on: ubuntu-latest

    steps:
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.tag }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
